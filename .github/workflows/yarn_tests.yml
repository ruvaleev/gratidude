name: Yarn tests

on:
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Run yarn tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: yarn install
      - run: yarn test
      
